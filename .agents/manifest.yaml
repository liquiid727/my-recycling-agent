# CN: 项目配置文件，声明工具、工作流、运行时或构建系统的可执行约定。
# EN: Project configuration file declaring executable tool, workflow, runtime, or build conventions.

version: 1
project: cycling-agent-docs
purpose: Spec-driven delivery and runtime governance for the cycling-agent product

defaults:
  language: zh-CN
  output_style: concise
  require_traceability: true
  require_open_questions: true
  protect_human_authored_files: true

context_order:
  - readme.md
  - README.md
  - .rules/project.md
  - rules/
  - spec-draft/
  - specs/current/project-context.md
  - specs/current/architecture-context.md
  - specs/current/domain-context.md
  - specs/current/
  - specs/changes/
  - tests/
  - ai/agents/

calling_convention:
  selection_source: .agents/manifest.yaml
  role_path_base: .agents/
  canonical_path_base: repository root
  prompt_assembly_order:
    - AGENTS.md
    - .codex/instructions.md
    - selected role metadata from .agents/manifest.yaml
    - selected role_prompt
    - selected canonical
    - selected skills
    - selected context_includes
  routing_rules:
    - Only load the selected role's role_prompt, canonical, skills, and context_includes.
    - Do not preload repository or external skills unless they are declared on the selected role.
    - Prefer switching agents or splitting tasks over broadening one agent's skill set.
    - Roles with empty skills run as role-and-rules-only agents.
    - New request intake must start with spec-draft-agent classification before downstream routing.

request_classes:
  - raw-requirement
  - draft-only
  - active-change
  - implementation
  - test
  - review
  - acceptance
  - tooling

change_states:
  - drafted
  - architected
  - designed
  - changed
  - executing
  - implementation-reviewed
  - test-ready
  - tested
  - final-reviewed
  - accepted
  - promoted
  - archived
  - blocked

review_results:
  - pass
  - warning
  - blocked
  - rejected

execution_routes:
  - route_key: frontend
    roles:
      - frontend-execution-agent
  - route_key: backend
    roles:
      - backend-execution-agent
  - route_key: local-runtime
    roles:
      - local-dev-runtime-agent
  - route_key: migration
    roles:
      - migration-execution-agent

roles:
  spec-draft-agent:
    role_prompt: roles/spec-draft-agent.md
    canonical: ai/agents/spec-draft-agent.md
    skill_mode: scoped_only
    skills: []
    context_includes:
      - .rules/project.md
      - spec-draft/README.md
      - spec-draft/_template/
      - spec-draft/requirement-intake-flow.md
      - specs/current/
      - specs/changes/
    owns:
      - request classification
      - spec-draft/
      - change-id suggestions
    outputs:
      - request class
      - structured draft
      - assumptions and open questions

  architecture-agent:
    role_prompt: roles/architecture-agent.md
    canonical: ai/agents/architecture-agent.md
    skill_mode: scoped_only
    skills:
      - name: cycling-agent-mvp-orchestration
        path: /Users/liquiid/.codex/skills/cycling-agent-mvp-orchestration/SKILL.md
        required: false
        purpose: Canonical backend orchestration, identifier rules, and system-boundary guidance.
    context_includes:
      - .rules/project.md
      - rules/backend/go-backend-governance.md
      - rules/backend/goose-migration-standards.md
      - rules/shared/error-code-governance.md
      - specs/current/project-context.md
      - specs/current/architecture-context.md
      - specs/current/domain-context.md
      - spec-draft/
      - specs/changes/
    owns:
      - architecture-review.md
      - system impact and route recommendations
    outputs:
      - architecture decision
      - dependency and migration risks
      - execution route recommendations

  ui-design-agent:
    role_prompt: roles/ui-design-agent.md
    canonical: ai/agents/ui-design-agent.md
    skill_mode: scoped_only
    activation_conditions:
      - Request changes frontend, user flow, interaction states, console UI, or design handoff.
      - Skip and mark `design-review.md` as `not-applicable` when the change is backend-only or tooling-only.
    skills:
      - name: tool-config-ui
        path: .skills/tool-config-ui/SKILL.md
        required: false
        purpose: Tool-style configuration pages, policy editors, switchboards, tables, and dangerous operations.
      - name: specos-ui-design
        path: .codex/skills/specos-ui-design/SKILL.md
        required: false
        purpose: Spec-driven UI design flow for repository-managed frontend layouts, states, and handoff notes.
    context_includes:

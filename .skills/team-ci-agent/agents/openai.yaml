# CN: 项目配置文件，声明工具、工作流、运行时或构建系统的可执行约定。
# EN: Project configuration file declaring executable tool, workflow, runtime, or build conventions.

interface:
  display_name: "Team CI Agent"
  short_description: "Portable Git validation and CI record guidance"
  default_prompt: "Use $team-ci-agent to validate this change for commit, PR, or merge, follow the repository commit emoji/type convention, and emit a CI Record."

policy:
  allow_implicit_invocation: true
